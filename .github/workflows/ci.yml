name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run validate
      - run: npm run test:e2e
      - run: npm run test:scale
      - run: npm run test:control-plane

  twenty-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/twenty-job-search-crm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --no-immutable
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn twenty build
